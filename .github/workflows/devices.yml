name: Devices

# Launches the app on a real Android emulator and an iPhone simulator, walks
# the shell, checks deep links through the operating system, and keeps the
# screenshots as an artifact for design review. Slower than CI, so it runs on
# pull requests and on demand only.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with ci.yml and CONTRIBUTING.md.
  FLUTTER_VERSION: 3.50.0

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Keep Gradle from holding memory the emulator needs
        # The project lets Gradle take up to 8 GB of heap and 4 GB of
        # metaspace, and its daemons stay alive after the build. Next to the
        # emulator on a 16 GB runner that ran out of memory and the emulator
        # was killed mid-test. These user-level settings win over the
        # project's, and only apply to this job.
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'
            echo 'kotlin.compiler.execution.strategy=in-process'
          } >> ~/.gradle/gradle.properties
      - run: tool/bootstrap.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          # The default 2 GB is tight for a debug build rendered in software.
          ram-size: 4096M
          disable-animations: true
          script: tool/ci/device_check_android.sh
      - name: Memory report (on failure)
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -iE 'out of memory|killed process|oom' | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: build/device-screenshots/
          if-no-files-found: warn
          retention-days: 30

  ios:
    name: iPhone simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tool/bootstrap.sh
      - run: tool/ci/device_check_ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: build/device-screenshots/
          if-no-files-found: warn
          retention-days: 30
