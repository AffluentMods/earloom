include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/gen/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
    - prefer_single_quotes
    - require_trailing_commas

formatter:
  page_width: 120
  trailing_commas: preserve
