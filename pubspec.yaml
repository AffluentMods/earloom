name: earloom
description: "Earloom: an Audiobookshelf client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  background_downloader: ^9.6.6
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0
  material_color_utilities: ^0.13.0
  flutter_web_auth_2: ^5.1.0
  home_widget: ^0.10.0
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  uuid: ^4.6.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  audio_metadata_reader: ^1.8.1
  file_picker: ^13.3.3
  android_file_picker: ^2.1.6
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^23.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/demo/covers/
    - assets/fonts/LICENSES/

  # Fonts are bundled. The app never fetches a font at runtime (privacy).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
